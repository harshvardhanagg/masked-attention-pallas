[project]
name = "masked-attention-pallas"
requires-python = "==3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ipykernel = "*"
pyarrow = "*"
jax = { version = "*", extras = ["cuda12"] }

[tool.pixi.dependencies]
rust = "*"
pygraphviz = "*"
uv = "*"
pytest = ">=9.0.1,<10"
pytest-xdist = ">=3.8.0,<4"
pytest-sugar = ">=1.1.1,<2"
graph-tool = ">=2.98,<3"
